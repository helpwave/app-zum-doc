name: Build iOS

on:
  workflow_call:
    outputs:
      app_version:
        description: Resolved iOS version name
        value: ${{ jobs.build.outputs.app_version }}
      build_number:
        description: Resolved iOS build number
        value: ${{ jobs.build.outputs.build_number }}

jobs:
  build:
    runs-on: macos-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME}"
            VERSION="${RAW#ios}"
            VERSION="${VERSION#-}"
            VERSION="${VERSION#/}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          MAJOR="${MAJOR//[^0-9]/}"
          MINOR="${MINOR//[^0-9]/}"
          PATCH="${PATCH//[^0-9]/}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          BUILD_NUMBER=$((10#${MAJOR} * 10000 + 10#${MINOR} * 100 + 10#${PATCH}))
          if [[ "${BUILD_NUMBER}" -lt 1 ]]; then
            BUILD_NUMBER=1
          fi
          echo "app_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"

