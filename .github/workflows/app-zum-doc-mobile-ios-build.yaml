      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare packages
        env:
          EXPO_NO_GIT_STATUS: "1"
          LANG: en_US.UTF-8
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          # IOS_TEAM_ID: ${{ steps.signing.outputs.team_id }}
        run: |
          pnpm --filter @app-zum-doc/utils run init
          pnpm --filter @app-zum-doc/mobile run prebuild:ios

      - name: Build unsigned IPA
        env:
          LANG: en_US.UTF-8
          RCT_NO_LAUNCH_PACKAGER: "1"
        run: |
          set -euo pipefail
          IOS_DIR="${GITHUB_WORKSPACE}/apps/mobile/ios"
          cd "${IOS_DIR}"

          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          if [[ -z "${WORKSPACE}" ]]; then
            echo "No Xcode workspace found after prebuild."
            exit 1
          fi

          SCHEME="$(xcodebuild -list -json -workspace "${WORKSPACE}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          schemes = data.get("workspace", {}).get("schemes", [])
          for scheme in schemes:
              if scheme.lower() != "pods":
                  print(scheme)
                  break
          ')"
          if [[ -z "${SCHEME}" ]]; then
            echo "No Xcode scheme found after prebuild."
            exit 1
          fi

          ARCHIVE_PATH="${RUNNER_TEMP}/AppZumDoc.xcarchive"
          EXPORT_PATH="${RUNNER_TEMP}/ios-export"
          mkdir -p "${EXPORT_PATH}"

          xcodebuild archive \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          APP_PATH="$(find "${ARCHIVE_PATH}/Products/Applications" -name '*.app' | head -n 1)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No .app found in the unsigned archive."
            exit 1
          fi

          PAYLOAD_DIR="${RUNNER_TEMP}/ipa-payload"
          rm -rf "${PAYLOAD_DIR}"
          mkdir -p "${PAYLOAD_DIR}/Payload"
          cp -R "${APP_PATH}" "${PAYLOAD_DIR}/Payload/"
          (cd "${PAYLOAD_DIR}" && zip -r "${EXPORT_PATH}/AppZumDoc-unsigned.ipa" Payload)

