name: Publish App Store

on:
  push:
    tags:
      - "ios*"

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Upload existing IPA to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Find the Build iOS run for this commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "Build iOS" \
            --commit "${GITHUB_SHA}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "${RUN_ID}" ]]; then
            echo "No successful 'Build iOS' run found for ${GITHUB_SHA}."
            echo "Push the commit first, wait for the build to go green, then push the tag."
            exit 1
          fi
          echo "Using Build iOS run ${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download IPA from that run
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_STORE_CONNECT_API_KEY}" || -z "${APP_STORE_CONNECT_KEY_ID}" ]]; then
            echo "APP_STORE_CONNECT_API_KEY and APP_STORE_CONNECT_KEY_ID are required."
            exit 1
          fi
          mkdir -p "${HOME}/.appstoreconnect/private_keys"
          printf '%s\n' "${APP_STORE_CONNECT_API_KEY}" \
            > "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "${HOME}/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Validate and upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "${RUNNER_TEMP}/ipa" -name '*.ipa' | head -n 1)"
          if [[ -z "${IPA_PATH}" ]]; then
            echo "No IPA in the downloaded artifact."
            exit 1
          fi

          # Show what we're about to ship (version + build number from the IPA itself).
          unzip -p "${IPA_PATH}" 'Payload/*.app/Info.plist' > "${RUNNER_TEMP}/Info.plist"
          echo "Version: $(plutil -extract CFBundleShortVersionString raw "${RUNNER_TEMP}/Info.plist") ($(plutil -extract CFBundleVersion raw "${RUNNER_TEMP}/Info.plist"))"

          xcrun altool --validate-app -f "${IPA_PATH}" -t ios \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"
          xcrun altool --upload-app -f "${IPA_PATH}" -t ios \
            --apiKey "${APP_STORE_CONNECT_KEY_ID}" --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Remove API key
        if: ${{ always() }}
        run: rm -rf "${HOME}/.appstoreconnect"
