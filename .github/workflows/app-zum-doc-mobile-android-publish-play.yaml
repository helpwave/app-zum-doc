name: Publish Play Store

on:
  push:
    tags:
      - "android@*"

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: "ubuntu-24.04" # @sync android.runner
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          chmod +x scripts/mobile-sync.sh
          scripts/mobile-sync.sh check
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/mobile-sync.sh check-tag "${GITHUB_REF_NAME}"
          else
            echo "not a tag (${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}); skipping tag check"
          fi
          echo "app_version=$(scripts/mobile-sync.sh get appVersion)" >> "${GITHUB_OUTPUT}"
          echo "code=$(scripts/mobile-sync.sh get code)" >> "${GITHUB_OUTPUT}"

  publish:
    needs: verify
    name: Upload existing AAB to Google Play
    runs-on: "ubuntu-24.04" # @sync android.runner

    steps:
      - name: Resolve version
        id: version
        env:
          APP_VERSION: ${{ needs.verify.outputs.app_version }}
          VERSION_CODE: ${{ needs.verify.outputs.code }}
        run: |
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Find the Build Android run for this commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "Build Android" \
            --commit "${GITHUB_SHA}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "${RUN_ID}" ]]; then
            echo "No successful 'Build Android' run found for ${GITHUB_SHA}."
            echo "Push the commit first, wait for the build to go green, then push the tag."
            exit 1
          fi
          echo "Using Build Android run ${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download AAB from that run
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: ${{ runner.temp }}/aab
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # @sync android.java

      - name: Verify AAB version matches tag
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.app_version }}
          EXPECTED_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          AAB_PATH="$(find "${RUNNER_TEMP}/aab" -name '*.aab' | head -n 1)"
          [[ -n "${AAB_PATH}" ]] || { echo "No AAB in the downloaded artifact."; exit 1; }
          echo "AAB_PATH=${AAB_PATH}" >> "${GITHUB_ENV}"
          curl -fsSL -o "${RUNNER_TEMP}/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar"
          MANIFEST="$(java -jar "${RUNNER_TEMP}/bundletool.jar" dump manifest --bundle="${AAB_PATH}")"
          GOT_VERSION="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' <<< "${MANIFEST}" | head -n 1)"
          GOT_CODE="$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' <<< "${MANIFEST}" | head -n 1)"
          echo "AAB: ${GOT_VERSION} (${GOT_CODE}) — tag ${GITHUB_REF_NAME} expects ${EXPECTED_VERSION} (${EXPECTED_CODE})"
          [[ "${GOT_VERSION}" == "${EXPECTED_VERSION}" ]] || { echo "Refusing to upload: version mismatch."; exit 1; }
          [[ "${GOT_CODE}" == "${EXPECTED_CODE}" ]] || { echo "Refusing to upload: version code mismatch."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
          working-directory: apps/mobile

      - name: Install Fastlane
        run: bundle install
        working-directory: apps/mobile

      - name: Write Play Store credentials
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PLAY_TRACK: ${{ secrets.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ secrets.PLAY_RELEASE_STATUS }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_STORE_JSON_KEY}" || -z "${PLAY_TRACK}" || -z "${PLAY_RELEASE_STATUS}" ]]; then
            echo "PLAY_STORE_JSON_KEY, PLAY_TRACK, and PLAY_RELEASE_STATUS are required."
            exit 1
          fi
          printf '%s\n' "${PLAY_STORE_JSON_KEY}" > "${RUNNER_TEMP}/play-store.json"
          chmod 600 "${RUNNER_TEMP}/play-store.json"

      - name: Upload to Google Play
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ runner.temp }}/play-store.json
          PLAY_TRACK: ${{ secrets.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ secrets.PLAY_RELEASE_STATUS }}
        working-directory: apps/mobile
        run: bundle exec fastlane android playstore

      - name: Remove Play Store credentials
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/play-store.json"
