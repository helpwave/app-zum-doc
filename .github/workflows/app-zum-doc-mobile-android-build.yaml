name: Build Android

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/mobile/**"
      - "packages/app-zum-doc-utils/**"
      - "scripts/mobile-sync.sh"
      - "apps/mobile/build-metadata.json"
      - ".github/workflows/app-zum-doc-mobile-android-build.yaml"
  workflow_call:
    outputs:
      app_version:
        description: Resolved Android version name
        value: ${{ jobs.build.outputs.app_version }}
      version_code:
        description: Resolved Android version code
        value: ${{ jobs.build.outputs.version_code }}
  workflow_dispatch:

jobs:
  verify:
    runs-on: "ubuntu-24.04" # @sync android.runner
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          chmod +x scripts/mobile-sync.sh
          scripts/mobile-sync.sh check
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/mobile-sync.sh check-tag "${GITHUB_REF_NAME}"
          else
            echo "not a tag (${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}); skipping tag check"
          fi
          echo "app_version=$(scripts/mobile-sync.sh get appVersion)" >> "${GITHUB_OUTPUT}"
          echo "code=$(scripts/mobile-sync.sh get code)" >> "${GITHUB_OUTPUT}"

  build:
    needs: verify
    runs-on: "ubuntu-24.04" # @sync android.runner
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.13.0" # @sync pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # @sync node
          cache: pnpm

      - name: Resolve version
        id: version
        env:
          APP_VERSION: ${{ needs.verify.outputs.app_version }}
          VERSION_CODE: ${{ needs.verify.outputs.code }}
        run: |
          echo "version=${APP_VERSION} version_code=${VERSION_CODE}"
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # @sync android.java

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0" # @sync android.sdkPackages

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare packages
        env:
          EXPO_NO_GIT_STATUS: "1"
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          pnpm --filter @app-zum-doc/utils run init
          pnpm --filter @app-zum-doc/mobile run prebuild:android

      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android release keystore secrets are required."
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/upload-keystore.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          {
            echo "storeFile=${KEYSTORE_PATH}"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "storeType=PKCS12"
          } > apps/mobile/android/keystore.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew
        working-directory: apps/mobile/android

      - name: Build
        run: pnpm --filter @app-zum-doc/mobile run android:release

      - name: Verify APK version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.app_version }}
          EXPECTED_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          [[ -n "${APK}" ]] || { echo "No release APK found."; exit 1; }
          AAPT2="$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          BADGING="$("${AAPT2}" dump badging "${APK}" | head -n 1)"
          echo "${BADGING}"
          GOT_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "${BADGING}")"
          GOT_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "${BADGING}")"
          echo "APK: ${GOT_VERSION} (${GOT_CODE}) — expected ${EXPECTED_VERSION} (${EXPECTED_CODE})"
          [[ "${GOT_VERSION}" == "${EXPECTED_VERSION}" ]] || { echo "versionName mismatch"; exit 1; }
          [[ "${GOT_CODE}" == "${EXPECTED_CODE}" ]] || { echo "versionCode mismatch"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
