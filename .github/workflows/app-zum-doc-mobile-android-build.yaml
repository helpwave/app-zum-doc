name: Build Android

on:
  workflow_call:
    outputs:
      app_version:
        description: Resolved Android version name
        value: ${{ jobs.build.outputs.app_version }}
      version_code:
        description: Resolved Android version code
        value: ${{ jobs.build.outputs.version_code }}
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW="${GITHUB_REF_NAME}"
            VERSION="${RAW#android}"
            VERSION="${VERSION#-}"
            VERSION="${VERSION#/}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          MAJOR="${MAJOR//[^0-9]/}"
          MINOR="${MINOR//[^0-9]/}"
          PATCH="${PATCH//[^0-9]/}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$((10#${MAJOR} * 10000 + 10#${MINOR} * 100 + 10#${PATCH}))
          if [[ "${VERSION_CODE}" -lt 1 ]]; then
            VERSION_CODE=1
          fi
          echo "app_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare packages
        env:
          EXPO_NO_GIT_STATUS: "1"
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          pnpm --filter @app-zum-doc/utils run init
          pnpm --filter @app-zum-doc/mobile run prebuild:android

      - name: Configure release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "No release keystore configured; Gradle will fall back to the debug keystore."
            exit 0
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/upload-keystore.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          {
            echo "storeFile=${KEYSTORE_PATH}"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "storeType=PKCS12"
          } > apps/mobile/android/keystore.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew
        working-directory: apps/mobile/android

      - name: Build
        run: pnpm --filter @app-zum-doc/mobile run android:release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
